<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Simple Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <h1 class="sr-only">Simple Calculator</h1>

    <div class="calculator" role="application" aria-label="Simple calculator">
      <div id="display" class="display" aria-live="polite">0</div>

      <div class="keys">
        <button class="btn func" data-action="clear" aria-label="Clear">C</button>
        <button class="btn func" data-action="back" aria-label="Backspace">⌫</button>
        <button class="btn op" data-value="(" aria-label="Open parenthesis">(</button>
        <button class="btn op" data-value=")" aria-label="Close parenthesis">)</button>

        <button class="btn" data-value="7">7</button>
        <button class="btn" data-value="8">8</button>
        <button class="btn" data-value="9">9</button>
        <button class="btn op" data-value="/" aria-label="Divide">÷</button>

        <button class="btn" data-value="4">4</button>
        <button class="btn" data-value="5">5</button>
        <button class="btn" data-value="6">6</button>
        <button class="btn op" data-value="*" aria-label="Multiply">×</button>

        <button class="btn" data-value="1">1</button>
        <button class="btn" data-value="2">2</button>
        <button class="btn" data-value="3">3</button>
        <button class="btn op" data-value="-" aria-label="Subtract">−</button>

        <button class="btn wide" data-value="0">0</button>
        <button class="btn" data-value=".">.</button>
        <button class="btn equals" data-action="equals" aria-label="Equals">=</button>
        <button class="btn op" data-value="+" aria-label="Add">+</button>
      </div>
    </div>

    <p class="hint">You can also use keyboard: numbers, + - * / ( ), Enter for =, Backspace, Esc to clear.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
